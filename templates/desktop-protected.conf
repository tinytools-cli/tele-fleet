# Tabs that must NEVER be auto-closed, one substring per line, matched against
# the URL. These hold LOGIN SESSIONS: closing one costs a human an
# authentication round, which is the whole reason idle-closing is dangerous.
#
# Earned the hard way once: closing one agent's idle Outlook tab dropped its
# Microsoft session and cost the operator a full Authenticator number-match to
# restore. An idle timer that cannot tell a dead tab from a signed-in one will
# eventually do that at the worst possible moment.
#
# THIS LIST WILL GO STALE. That is expected. Add to it freely -- a false
# protect costs a little memory; a false close costs somebody their afternoon.
outlook.
office.com
m365.cloud.microsoft
login.microsoftonline
login.live.com
web.whatsapp.com
sharepoint.com
github.com
